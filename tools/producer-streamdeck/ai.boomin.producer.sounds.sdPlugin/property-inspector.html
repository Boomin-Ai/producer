<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px system-ui;background:#2d2d2d;color:#eee;padding:12px}label{display:block;margin:14px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:8px;background:#444;color:white;border:1px solid #666;border-radius:5px}button{margin-top:10px}p{font-size:12px;line-height:1.5;color:#bbb}</style></head><body><strong>Producer Sounds</strong><p>In your Producer room, open Sounds → Stream Deck → Copy connection.</p><label for="connection">Pairing connection</label><input id="connection" type="password" autocomplete="off"><button id="pair">Connect</button><label for="sound">Room sound</label><select id="sound"><option value="">Connect and choose a sound</option></select><button id="refresh">Refresh room sounds</button><p id="status">Waiting for Producer</p><script>
let ws,context,action,settings={};const el=id=>document.getElementById(id);function send(event,payload){ws.send(JSON.stringify({event,context,action,payload}))}
window.connectElgatoStreamDeckSocket=(port,uuid,registerEvent,info,actionInfo)=>{context=uuid;const actionData=JSON.parse(actionInfo);action=actionData.action;settings=actionData.payload.settings??{};ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));send('sendToPlugin',{refresh:true})};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.event!=='sendToPropertyInspector')return;const p=m.payload;el('connection').value=p.connection??'';el('status').textContent=p.error||(p.paired?'Connected to room '+p.room:'Producer disconnected');el('sound').replaceChildren(new Option('Choose a sound',''),...(p.pads??[]).map(s=>new Option(s.name,s.id)));el('sound').value=settings.sound??'';};};
el('pair').onclick=()=>send('sendToPlugin',{connection:el('connection').value});el('refresh').onclick=()=>send('sendToPlugin',{refresh:true});el('sound').onchange=()=>{settings.sound=el('sound').value;send('setSettings',settings)};
</script></body></html>
