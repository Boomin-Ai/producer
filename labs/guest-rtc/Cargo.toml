[package]
name = "producer-guest-rtc-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[features]
obs-proof = []
physical-aec = []

[[bin]]
name = "producer-speakerphone-lab"
path = "src/bin/speakerphone.rs"
required-features = ["physical-aec"]

[dependencies]
livekit = { version = "=0.9.4", default-features = false, features = ["native", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
anyhow = "1"
webrtc-sys = "=0.3.48"
cxx = "1.0"

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
libwebrtc = { path = "vendor/libwebrtc" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Keep native timing experiments representative of the optimized application:
# debug iterator/JSON traversal in this fixture must not dominate frame deadlines.
# Optimize this lab only; retain the pinned SDK and all queue/sync limits.
[profile.dev.package.producer-guest-rtc-lab]
opt-level = 2
