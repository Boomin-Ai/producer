[package]
name = "producer-guest-rtc-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
livekit = { version = "=0.9.4", default-features = false, features = ["native", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
anyhow = "1"
webrtc-sys = "=0.3.48"
cxx = "1.0"

[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
