<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent!important; }
#messages { position:absolute; left:2.5%; bottom:4%; width:34%; max-height:65%; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
.message { flex:none; color:white; font:600 clamp(16px,1.9vw,36px)/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow-wrap:anywhere; text-shadow:0 2px 3px #000,0 0 5px #000,1px 0 2px #000,-1px 0 2px #000; }
.user { font-weight:800; }
.platform { font-size:.58em; font-weight:800; letter-spacing:.04em; margin-right:.6em; vertical-align:middle; color:#ddd; }
img { height:1.3em; max-width:3em; object-fit:contain; vertical-align:middle; }
</style></head><body><div id="messages" aria-live="polite"></div>
<script>
const root = document.getElementById('messages');
const nodes = new Map();
let snapshot = { messages:[], emotes:{} };
function imageUrl(value) {
  try { const u = new URL(value); return u.protocol === 'https:' ? u.href : null; } catch { return null; }
}
function render() {
  const messages = (snapshot.messages || []).slice(-8);
  const keep = new Set();
  for (const m of messages) {
    const key = `${m.platform}:${m.id || m.received_at}`;
    keep.add(key);
    let node = nodes.get(key);
    const emotes = {...snapshot.emotes?.[m.platform], ...m.emotes};
    const fingerprint = JSON.stringify([m.user,m.text,m.color,emotes]);
    if (!node) { node = document.createElement('div'); node.className='message'; nodes.set(key,node); root.appendChild(node); }
    if (node.dataset.content !== fingerprint) {
      node.replaceChildren();
      const platform = document.createElement('span'); platform.className='platform'; platform.textContent=({twitch:'TW',kick:'K',youtube:'YT',boomin:'Boomin'})[m.platform] || m.platform;
      const user = document.createElement('span'); user.className='user'; user.textContent=m.user+': ';
      user.style.color=/^#[0-9a-f]{6}$/i.test(m.color || '') ? m.color : '#77dfbd';
      node.append(platform,user);
      for (const token of String(m.text).split(/(\s+)/)) {
        const url = imageUrl(emotes[token]);
        if (url) { const img=document.createElement('img'); img.src=url; img.alt=token; node.append(img); }
        else node.append(document.createTextNode(token));
      }
      node.dataset.content=fingerprint;
    }
    root.appendChild(node); // Snapshot order can change when filters or room history change.
  }
  for (const [key,node] of nodes) if (!keep.has(key)) { node.remove(); nodes.delete(key); }
}
async function poll() {
  try { const res = await fetch('/chat-state.json',{cache:'no-store'}); if(res.ok) snapshot=(await res.json()) || {messages:[],emotes:{}}; } catch {}
  render();
  setTimeout(poll,250);
}
poll();
</script></body></html>
