[package]
name = "producer"
version = "0.4.13"
description = "Producer by Boomin — the open-source studio for creators: post everywhere, stream everywhere."
authors = ["Boomin"]
license = "AGPL-3.0-only"
repository = "https://github.com/Boomin-Ai/producer"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "producer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The transparent/vibrancy window is macOS-only by design, so the feature that
# unlocks it is too. Pairs with macOSPrivateApi in tauri.macos.conf.json.
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# macos-private-api is declared PLAIN and macOSPrivateApi lives in the BASE
# config: tauri-build's feature/config check parses Cargo.toml textually and
# cannot see target-scoped features (macOS build broke), while a feature
# without the config flag fails the same check (Windows broke). Symmetric
# declarations satisfy the check on BOTH platforms; the feature is inert off
# macOS. The
# macOSPrivateApi allowlist entry lives in tauri.macos.conf.json (the
# per-platform overlay), which is not merged on other platforms — so enabling
# the feature unconditionally makes tauri-build fail the config/feature
# consistency check on Windows and Linux.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
base64 = "0.22"
jpeg-encoder = "0.6"
