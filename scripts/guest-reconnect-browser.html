<!doctype html><html><body><video id="remote" autoplay muted playsinline></video><script type="module">
import { HostLink } from '/server/guest/src/hostLink.ts';
const NativeSocket = window.WebSocket;
window.runGuestReconnectTest = async () => {
  const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 180;
  const ctx = canvas.getContext('2d'); let tick = 0;
  const drawing = setInterval(() => { ctx.fillStyle = tick++ % 2 ? '#00bb88' : '#2255aa'; ctx.fillRect(0, 0, 320, 180); }, 50);
  const camera = canvas.captureStream(15);
  const sockets = [], hosts = [];
  let renewals = 0, queuedSignals = 0;
  class Socket {
    static OPEN = 1;
    constructor(url) {
      this.url = url; this.readyState = 0; this.queue = Promise.resolve(); this.ice = [];
      this.host = new RTCPeerConnection({ iceServers: [] }); hosts.push(this.host); sockets.push(this);
      this.host.ontrack = e => { document.getElementById('remote').srcObject = e.streams[0] ?? new MediaStream([e.track]); };
      this.host.onicecandidate = e => { if (e.candidate) this.deliver({ kind: 'ice', candidate: e.candidate.toJSON() }); };
      setTimeout(() => { this.readyState = 1; this.onopen?.(); }, 10);
    }
    deliver(payload) { if (this.readyState === 1) queueMicrotask(() => this.onmessage?.({ data: JSON.stringify({ type: 'signal', payload: { ...payload, peer: 'main' } }) })); }
    send(raw) {
      const { payload } = JSON.parse(raw); if (payload.peer !== 'main') return;
      this.queue = this.queue.then(async () => {
        if (this.readyState !== 1) return;
        if (payload.kind === 'hello' && sockets.length > 1 && !this.host.localDescription) {
          this.host.addTransceiver('video', { direction: 'recvonly' });
          await this.host.setLocalDescription(await this.host.createOffer());
          this.deliver({ kind: 'sdp', description: this.host.localDescription });
        } else if (payload.description) {
          await this.host.setRemoteDescription(payload.description);
          for (const ice of this.ice.splice(0)) await this.host.addIceCandidate(ice);
          if (payload.description.type === 'offer') {
            await this.host.setLocalDescription(await this.host.createAnswer());
            this.deliver({ kind: 'sdp', description: this.host.localDescription });
          }
        } else if (payload.candidate) {
          if (this.host.remoteDescription) await this.host.addIceCandidate(payload.candidate);
          else { this.ice.push(payload.candidate); queuedSignals++; }
        }
      });
    }
    close() { this.readyState = 3; this.onclose?.(); }
  }
  window.WebSocket = Socket;
  const link = new HostLink({
    session: { ice_servers: [], signaling_url: '/first', signaling_ticket: 'first' }, wsUrl: 'wss://local.test/first',
    refreshSession: async () => { renewals++; return { session: { ice_servers: [], signaling_url: '/fresh', signaling_ticket: 'fresh' }, wsUrl: 'wss://local.test/fresh' }; },
    localStream: () => camera, returnFeed: false, delayReturnFeedMs: 0, onMainState() {}, onProgram() {}, onHostAudio() {},
  });
  const wait = async predicate => { const until = Date.now() + 15000; while (!(await predicate())) { if (Date.now() > until) throw new Error('Video did not recover'); await new Promise(r => setTimeout(r, 100)); } };
  const decoded = async host => { let frames = 0; for (const stat of (await host.getStats()).values()) if (stat.type === 'inbound-rtp' && stat.kind === 'video') frames += stat.framesDecoded ?? 0; return frames; };
  try {
    await wait(async () => await decoded(hosts[0]) > 3);
    const before = await decoded(hosts[0]);
    sockets[0].close(); hosts[0].close();
    await wait(async () => hosts.length > 1 && await decoded(hosts[1]) > 3);
    const after = await decoded(hosts[1]);
    const live = camera.getVideoTracks()[0].readyState;
    return { before, after, renewals, cameraState: live, queuedSignals, peers: hosts.length };
  } finally {
    link.close(); for (const host of hosts) host.close(); camera.getTracks().forEach(t => t.stop()); clearInterval(drawing); window.WebSocket = NativeSocket;
  }
};
</script></body></html>
