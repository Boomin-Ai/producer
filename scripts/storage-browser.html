<!doctype html><html><head><meta charset="utf-8"><title>Storage regression</title></head><body><div id="root"></div><output id="result">Running</output><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {StoragePanel} from '/src/components/StoragePanel.tsx';
const disk=new Map();let fail=false;let reads=0;
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
 if(command==='manager_cache_scope')return args.endpointId;
 if(command==='manager_cache_get')return disk.get(args.endpointId+args.resource)??null;
 if(command==='manager_cache_set'){disk.set(args.endpointId+args.resource,args.value);return;}
 if(command==='producer_storage_usage')return {total_bytes:5120,app_data_bytes:2048,recording_bytes:3072,recording_count:2,missing_recordings:0,unreadable_entries:0};
 if(command==='endpoint_request'){reads++;if(args.endpointId==='old')return {available:true,status:404};if(fail)return {available:true,status:500};return {available:true,status:200,body:{total_bytes:args.endpointId==='second'?'2048':'1048576',object_count:2,unknown_size_count:0,external_file_count:3,scope:'brand',measured_at:'2026-09-28T12:00:00Z',categories:[{kind:'video',bytes:args.endpointId==='second'?'2048':'1048576',count:2}]}};}
 throw Error(command);
}};
const root=createRoot(document.getElementById('root'));const endpoint=id=>({id,name:id,base_url:'https://example.test',brand_slug:id,kind:'connected',created_at:''});const pause=()=>new Promise(r=>setTimeout(r,20));async function until(fn){for(let n=0;n<250;n++){if(fn())return;await pause();}throw Error('timeout');}const check=(v,m)=>{if(!v)throw Error(m);};
try{root.render(React.createElement(StoragePanel,{endpoint:endpoint('first')}));await until(()=>document.querySelector('.set-storage-total')?.textContent==='1 MB');check(document.body.textContent.includes('5 KB'),'local total missing');check(document.body.textContent.includes('3 external links excluded'),'external media not explained');const before=reads;root.render(React.createElement('p',null,'outside'));await pause();root.render(React.createElement(StoragePanel,{endpoint:endpoint('first')}));await until(()=>document.querySelector('.set-storage-total')?.textContent==='1 MB');check(reads===before,'fresh storage refetched');fail=true;document.querySelector('.set-storage-heading button').click();await until(()=>document.querySelector('[role=alert]'));check(document.querySelector('.set-storage-total').textContent==='1 MB','failed refresh dropped usage');fail=false;root.render(React.createElement(StoragePanel,{endpoint:endpoint('second')}));await until(()=>document.querySelector('.set-storage-total')?.textContent==='2 KB');check(!document.body.textContent.includes('1 MB'),'previous brand leaked');root.render(React.createElement(StoragePanel,{endpoint:endpoint('old')}));await until(()=>document.body.textContent.includes('awaiting the Boomin API update'));check(document.querySelector('.set-storage-total').textContent==='—','missing API showed fake zero');document.getElementById('result').textContent='PASS: hosted and local usage, cache reuse, failed refresh, brand switch and unavailable reporting';}catch(e){document.getElementById('result').textContent='FAIL: '+e.message;}
</script></body></html>
