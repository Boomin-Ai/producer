# Producer engine CI — LIVE-REVIEW.md D5: build-on-engine-change, consume-by-hash.
# Builds libobs + the §5.2 plugin allowlist from the OBS source pinned in
# engine/obs.lock using the producer-macos preset, gates the result on the
# zero-Qt closure check, and publishes the immutable artifact.
#
# This workflow is new in M-L1 and validates assumption A1 (source build under
# our preset) — the local spike consumes the R1-fallback extracted engine
# until this has run green. Owned by the engine track; release.yml is not
# touched by this pipeline (app CI consumes the artifact by SHA256).
name: engine

on:
  push:
    branches: ["main", "live/**"]
    paths:
      - "engine/obs.lock"
      - "engine/producer-presets.json"
      - "engine/producer-project-include.cmake"
      - "engine/patches/**"
      - "scripts/build-engine.sh"
      - "scripts/build-engine-windows.sh"
      - "scripts/engine-lib.sh"
      - "scripts/engine-closure.sh"
      - "scripts/engine-closure-windows.sh"
      # The virtual-camera pair is built by these on both engine paths, so a
      # change to either must be validated like any other engine change.
      - "scripts/build-virtualcam-plugin.sh"
      - "scripts/build-camera-extension.sh"
  workflow_dispatch:

jobs:
  build-macos-arm64:
    # macOS 15 runner ships Xcode 16.x / SDK 15 — matches the 32.1.2 pin.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      # simde is a header-only SSE shim libobs needs on arm64. A CMake build
      # of OBS gets it from obs-deps; our standalone virtual-camera plugin
      # build compiles outside that, so it needs the headers directly.
      - name: Install simde
        run: brew install simde

      - name: Build engine from pinned source
        run: ./scripts/build-engine.sh

      - name: Zero-Qt closure gate
        run: |
          stage=$(ls -d engine/artifacts/producer-libobs-macos-arm64-*/ | head -1)
          ./scripts/engine-closure.sh "$stage"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: producer-libobs-macos-arm64
          path: |
            engine/artifacts/*.tar.zst
            engine/artifacts/*.sha256
          if-no-files-found: error

  # ── Windows x64 ─────────────────────────────────────────────────────────────
  # Same lock, same patchset, same manifest writer; different build body. See
  # docs/WINDOWS-ENGINE.md and scripts/build-engine-windows.sh for why the
  # dispatch-loop patch is applied but NOT enabled here (obs-browser is already
  # Qt-free on Windows, so CEF pumps its own message loop).
  #
  # This job is what makes GUESTS possible on Windows: guests are browser
  # sources, and the extracted-release engine the port started against carries
  # no obs-browser at all.
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash, so the sibling script and engine-lib.sh run unmodified.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # zstd for pack_artifact; the runner has cmake and VS 2022 already.
      - name: Install zstd
        run: choco install zstandard -y --no-progress

      - name: Build engine from pinned source
        run: ./scripts/build-engine-windows.sh

      - name: Zero-Qt closure gate
        run: |
          stage=$(ls -d engine/artifacts/producer-libobs-windows-x64-*/ | head -1)
          ./scripts/engine-closure-windows.sh "$stage"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: producer-libobs-windows-x64
          path: |
            engine/artifacts/*.tar.zst
            engine/artifacts/*.sha256
          if-no-files-found: error
