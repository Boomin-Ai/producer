name: Native Dev runner benchmark
on:
  push:
    branches: [bench/native-dev-runners]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, blacksmith-6vcpu-macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Time native builds and execute the tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          desktop=crates/production-runtime/desktop
          out="$RUNNER_TEMP/bench/Contents"
          mkdir -p "$out/MacOS" "$out/Resources"
          cp -R assets/starter-audio "$out/Resources/"
          ln -s "$(command -v ffmpeg)" "$out/MacOS/ffmpeg"
          for trial in cold warm-1 warm-2 warm-3; do
            touch "$desktop/src/main.rs"
            start=$SECONDS
            cargo test --locked --manifest-path "$desktop/Cargo.toml" --no-run --message-format=json > "$RUNNER_TEMP/tests.jsonl"
            exe=$(jq -rs 'map(select(.profile.test == true and .target.name == "producer-native-room" and .executable != null))|last.executable' "$RUNNER_TEMP/tests.jsonl")
            cp "$exe" "$out/MacOS/studio-tests"
            "$out/MacOS/studio-tests" --test-threads=2
            tests=$((SECONDS-start))
            cargo build --locked --manifest-path "$desktop/Cargo.toml"
            echo "$trial: tests ${tests}s; Dev executable $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
          done
          cp "$desktop/target/debug/producer-native-room" "$RUNNER_TEMP/producer-native-room"
          strip -S "$RUNNER_TEMP/producer-native-room"
          codesign --force --sign - "$RUNNER_TEMP/producer-native-room"
      - uses: actions/upload-artifact@v4
        with:
          name: producer-dev-${{ matrix.runner }}
          path: ${{ runner.temp }}/producer-native-room
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: studio-tests-${{ matrix.runner }}
          path: ${{ runner.temp }}/bench/Contents/MacOS/studio-tests
          if-no-files-found: ignore
          retention-days: 2
