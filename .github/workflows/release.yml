name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload assets to the public GitHub release (false = dry-run: build, notarize, verify, upload as Actions artifact only)"
        type: boolean
        default: false
      native_guest:
        description: "Include the native LiveKit guest runtime in the Apple Silicon candidate"
        type: boolean
        default: false
      promote_run:
        description: "Completed Release run to promote without rebuilding (blank = normal build)"
        type: string
        default: ""
      candidate_tag:
        description: "Existing draft LiveKit candidate tag for promotion"
        type: string
        default: ""
      expected_mac_sha256:
        description: "Verified notarized installer SHA-256 for promotion"
        type: string
        default: ""

# Public writers stay serialized: a manifest and its signed bytes must come
# from the same run. Private Actions-only candidates have a separate queue so
# a production release cannot cancel the Mac performance test track. Legacy
# promotion also writes releases, even when its publish input is false.
concurrency:
  group: release-${{ (github.event_name == 'push' || inputs.publish || inputs.promote_run != '') && 'public' || 'private' }}
  cancel-in-progress: true

env:
  PRODUCER_SOURCE_SHA: ${{ github.sha }}

jobs:
  validate-public-source:
    if: ${{ inputs.promote_run == '' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_EVENT: ${{ github.event_name }}
      NATIVE_GUEST: ${{ inputs.native_guest }}
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable source and reserve one release draft
        id: draft
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          version = config['version']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version), 'Public builds require a stable version; performance candidates stay private'
          assert json.loads(Path('package.json').read_text())['version'] == version, 'Frontend/native version mismatch'
          package = Path('src-tauri/Cargo.toml').read_text().split('[package]', 1)[1].split('\n[', 1)[0]
          assert re.search(r'^version\s*=\s*"' + re.escape(version) + '"\s*$', package, re.M), 'Cargo package version mismatch'
          locked = next(block for block in Path('src-tauri/Cargo.lock').read_text().split('[[package]]') if re.search(r'^name = "producer"$', block, re.M))
          assert re.search(r'^version = "' + re.escape(version) + '"$', locked, re.M), 'Cargo lock version mismatch'
          if os.environ['RELEASE_EVENT'] == 'push':
              assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version, 'Tag does not match the packaged version'
          else:
              assert os.environ['NATIVE_GUEST'] == 'true', 'Public dispatch must set native_guest=true'
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          tag = 'v' + version
          endpoint = f'repos/{repo}/releases'
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp', endpoint + '?per_page=100']))
          matches = [r for page in pages for r in page if r['tag_name'] == tag]
          assert len(matches) <= 1, 'Multiple drafts for this version; reconcile them before starting platform jobs'
          if matches:
              release = matches[0]
          else:
              body = dict(tag_name=tag, target_commitish=sha, name='Producer ' + tag, draft=True, prerelease=False, make_latest='false')
              release = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', endpoint, '--input', '-'], input=json.dumps(body), text=True))
          assert release['draft'] and not release['prerelease'] and release['target_commitish'] == sha, 'Release draft belongs to another source or channel'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'release_id={release["id"]}', file=out)
          print(f'Validated stable {version} at {sha}; reserved draft {release["id"]}')
          PY
  promote-signed-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.promote_run }}
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      EXPECTED_MAC_SHA256: ${{ inputs.expected_mac_sha256 }}
    steps:
      - name: Verify completed build and draft target
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess
          run_id = os.environ['SOURCE_RUN']; tag = os.environ['CANDIDATE_TAG']
          assert re.fullmatch(r'[0-9]+', run_id)
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-livekit\.[0-9]+', tag)
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['EXPECTED_MAC_SHA256'])
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/Boomin-Ai/producer/'+path]))
          build = api('actions/runs/'+run_id)
          assert build['name'] == 'Release' and build['conclusion'] == 'success'
          release = next(r for r in api('releases?per_page=30') if r['tag_name'] == tag)
          assert release['draft'] and release['prerelease']
          assert release['target_commitish'] == build['head_sha']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Producer-macos-arm64-live
          run-id: ${{ inputs.promote_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact signed installer bytes and retain other platforms
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, os
          files = list(pathlib.Path('candidate').glob('*.dmg'))
          assert len(files) == 1
          assert hashlib.sha256(files[0].read_bytes()).hexdigest() == os.environ['EXPECTED_MAC_SHA256']
          PY
          gh release download v0.4.69 --repo Boomin-Ai/producer -p 'Producer_0.4.69_x64.dmg' -p 'Producer_0.4.69_x64-setup.exe' -p 'Producer_0.4.69_amd64.AppImage' -D candidate
          (cd candidate && sha256sum * > SHA256SUMS.txt)
      - name: Upload complete candidate and publish
        run: |
          gh release upload "$CANDIDATE_TAG" candidate/* --clobber --repo Boomin-Ai/producer
          python3 - <<'PY'
          import os, json, pathlib, subprocess
          tag = os.environ['CANDIDATE_TAG']
          releases = json.loads(subprocess.check_output(['gh','api','repos/Boomin-Ai/producer/releases?per_page=30']))
          release = next(r for r in releases if r['tag_name'] == tag)
          for file in pathlib.Path('candidate').iterdir():
            assert any(a['name'] == file.name and a['state'] == 'uploaded' and a['size'] == file.stat().st_size for a in release['assets'])
          PY
          gh release edit "$CANDIDATE_TAG" --draft=false --prerelease --latest=false --repo Boomin-Ai/producer
  # ── Linux / Intel-mac (engine-less, unchanged path) ────────────────────────
  # Skipped on dry-runs so a dispatch can't clobber public release assets.
  # Windows left this matrix when build-windows-live landed: an engine-less
  # Windows exe here would race the live one for the same asset names, and
  # tauri-action's latest.json entry would point updaters at a stub build.
  build:
    if: ${{ inputs.promote_run == '' && (github.event_name == 'push' || inputs.publish) }}
    needs: [validate-public-source]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            targets: x86_64-apple-darwin
          - platform: ubuntu-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          # Avoid the Azure mirror stalling large WebKit downloads on hosted runners.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundled tempo engine is linked into Tauri's shared library.
          CXXFLAGS: ${{ runner.os == 'Linux' && '-fPIC' || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri emits signed payloads. The final verifier is the only writer
          # of latest.json, after all platform jobs finish.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.validate-public-source.outputs.release_id }}
          tagName: v__VERSION__
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Notarize and staple Intel installer image
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PW: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          DMG="Producer_${VERSION}_x64.dmg"
          gh release download "v$VERSION" --pattern "$DMG"
          bash scripts/notarize-intel-dmg.sh "$DMG"
          gh release upload "v$VERSION" "$DMG" --clobber

  # ── macOS arm64 + Live engine (Producer Live) ──────────────────────────────
  # Ordering is load-bearing (see docs/LIVE-REVIEW.md §5.2/D5):
  #   engine artifact on disk BEFORE tauri build   (build.rs links libobs then;
  #     absent artifact = silent stub build — guarded below with otool)
  #   engine inside the .app BEFORE notarization    (Apple scans nested Mach-Os)
  build-macos-arm64-live:
    if: ${{ !cancelled() && inputs.promote_run == '' && (needs.validate-public-source.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
    needs: [validate-public-source]
    permissions:
      contents: write
    runs-on: macos-latest
    # Deliberately NOT named APPLE_* at job scope: tauri's bundler reads those
    # names and would sign/notarize the engine-less intermediate build.
    env:
      GH_TOKEN: ${{ github.token }}
      SIGN_IDENT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
      CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      NOTARY_ID: ${{ secrets.APPLE_ID }}
      NOTARY_PW: ${{ secrets.APPLE_PASSWORD }}
      NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # v0.2.0 postmortem: NO fallbacks, NO stale artifacts. The artifact for
      # the CURRENT obs.lock lockhash must exist among recent green engine.yml
      # runs or the release fails — run engine.yml for this lock first.
      - name: Fetch engine artifact (current obs.lock hash — fail hard on miss)
        run: |
          set -euo pipefail
          ARCH="$(python3 -c "import json;print(json.load(open('engine/obs.lock'))['arch'])")"
          NAME="producer-libobs-macos-${ARCH}-$(shasum -a 256 engine/obs.lock | cut -c1-12)"
          echo "want: $NAME"
          FOUND=""
          for RUN_ID in $(gh run list --workflow=engine.yml --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            rm -rf /tmp/engine-dl
            gh run download "$RUN_ID" -n "producer-libobs-macos-${ARCH}" -D /tmp/engine-dl 2>/dev/null || continue
            if [ -f "/tmp/engine-dl/$NAME.tar.zst" ]; then FOUND="$RUN_ID"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "FATAL: no engine artifact matches the current obs.lock ($NAME) in the last 10 green engine runs." >&2
            echo "Run engine.yml for this obs.lock (push to engine paths or workflow_dispatch), then re-run the release." >&2
            exit 1
          fi
          (cd /tmp/engine-dl && shasum -a 256 -c "$NAME.tar.zst.sha256")
          mkdir -p engine/artifacts
          tar --zstd -xf "/tmp/engine-dl/$NAME.tar.zst" -C engine/artifacts/ \
            || tar --use-compress-program=unzstd -xf "/tmp/engine-dl/$NAME.tar.zst" -C engine/artifacts/
          echo "engine: CI source-build artifact (run $FOUND)"
          test -d "engine/artifacts/$NAME/Frameworks/libobs.framework" \
            || { echo "FATAL: engine artifact missing after fetch — refusing to ship a stub build" >&2; exit 1; }
          echo "ENGINE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build single camera and retired-device migration from pinned source
        run: |
          set -euo pipefail
          brew install simde
          PIN="$(python3 -c "import json;print(json.load(open('engine/obs.lock'))['obs']['commit'])")"
          git init engine/obs-studio
          git -C engine/obs-studio remote add origin https://github.com/obsproject/obs-studio.git
          git -C engine/obs-studio fetch --depth 1 origin "$PIN"
          git -C engine/obs-studio checkout --detach FETCH_HEAD
          bash scripts/build-camera-extension.sh
          bash scripts/build-retired-camera-extension.sh
          bash scripts/build-virtualcam-plugin.sh --stage "engine/artifacts/$ENGINE_NAME"

      - name: Require Apple signing and notarization credentials
        run: |
          set -euo pipefail
          for KEY in SIGN_IDENT CERT_B64 PROFILE_B64 NOTARY_ID NOTARY_PW NOTARY_TEAM; do
            test -n "${!KEY:-}" || { echo "FATAL: $KEY is required for an Apple-signed release" >&2; exit 1; }
          done

      - name: Import signing certificate
        if: env.CERT_B64 != ''
        run: |
          set -euo pipefail
          KC=build.keychain
          security create-keychain -p ci "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign
          rm /tmp/cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null

      - name: Restore camera provisioning profile
        run: |
          set -euo pipefail
          test -n "$PROFILE_B64" || { echo "FATAL: APPLE_PROVISIONING_PROFILE is required for camera installation" >&2; exit 1; }
          printf '%s' "$PROFILE_B64" | base64 --decode > scripts/embedded.provisionprofile
          security cms -D -i scripts/embedded.provisionprofile > /tmp/producer-profile.plist
          python3 - <<'PY'
          import datetime, os, plistlib
          with open('/tmp/producer-profile.plist', 'rb') as f:
              profile = plistlib.load(f)
          ent = profile['Entitlements']
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Provisioning profile expired'
          assert profile['TeamIdentifier'] == [os.environ['NOTARY_TEAM']], 'Wrong provisioning team'
          assert ent.get('com.apple.application-identifier') == os.environ['NOTARY_TEAM'] + '.ai.boomin.producer', 'Wrong provisioning app'
          assert ent.get('com.apple.developer.system-extension.install') is True, 'System Extension capability missing'
          PY

      # No APPLE_* env here on purpose: tauri must NOT sign/notarize the
      # engine-less intermediate app; signing happens after engine assembly.
      - name: Check native preview coordinate mapping
        run: |
          clang -fobjc-arc -fblocks scripts/test-preview-geometry.m src-tauri/src/live/shim.m \
            -framework AppKit -framework WebKit -framework AVFoundation \
            -framework CoreMediaIO -framework SystemExtensions -framework CoreGraphics -framework Security \
            -o /tmp/producer-preview-geometry-test
          /tmp/producer-preview-geometry-test
          node scripts/test-preview-session.mjs

      - name: Build app (engine linked, unsigned)
        env:
          INCLUDE_NATIVE_GUEST: ${{ (github.event_name == 'push' || inputs.native_guest) && '1' || '0' }}
          # Keep release optimization and archive line symbols separately.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        run: |
          if [ "$INCLUDE_NATIVE_GUEST" = "1" ]; then
            bun run tauri build --target aarch64-apple-darwin --features guest-rtc-production
          else
            bun run tauri build --target aarch64-apple-darwin
          fi

      - name: Archive matching production symbols
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Producer.app"
          SYMBOLS="src-tauri/target/aarch64-apple-darwin/release/producer.dSYM"
          # Cargo preserves its artifact hash in the inner DWARF filename.
          # Validate the actual file; the binary/dSYM UUID check below remains authoritative.
          python3 - "$SYMBOLS" <<'PY'
          import pathlib, sys
          files = [p for p in (pathlib.Path(sys.argv[1]) / 'Contents/Resources/DWARF').glob('*') if p.is_file()]
          assert len(files) == 1 and files[0].stat().st_size > 0, 'Missing or ambiguous release DWARF file'
          PY
          mkdir -p /tmp/producer-symbols
          ditto "$SYMBOLS" /tmp/producer-symbols/Producer.app.dSYM
          xcrun dwarfdump --uuid "$APP/Contents/MacOS/Producer" > /tmp/producer-symbols/binary-uuid.txt
          xcrun dwarfdump --uuid /tmp/producer-symbols/Producer.app.dSYM > /tmp/producer-symbols/symbol-uuid.txt
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('/tmp/producer-symbols')
          uuids = lambda name: set(re.findall(r'UUID: ([A-Fa-f0-9-]+)', (root / name).read_text()))
          binary, symbols = uuids('binary-uuid.txt'), uuids('symbol-uuid.txt')
          assert binary and binary == symbols, 'Release symbol UUID mismatch'
          PY
          printf '%s\n' "$PRODUCER_SOURCE_SHA" > /tmp/producer-symbols/source-revision.txt

      - name: Retain production symbols for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: producer-macos-symbols-${{ github.sha }}
          path: /tmp/producer-symbols
          retention-days: 90

      - name: Guard — refuse stub build
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Producer.app"
          test -d "$APP" || { echo "FATAL: app bundle not found" >&2; exit 1; }
          otool -L "$APP/Contents/MacOS/Producer" | grep -q libobs \
            || { echo "FATAL: binary not linked against libobs — stub build (have_engine cfg absent)" >&2; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Assemble engine into bundle + sign inner→outer
        run: CODESIGN_IDENT="${SIGN_IDENT:--}" ./scripts/assemble-engine-bundle.sh "$APP"

      - name: Re-sign app with hardened runtime entitlements
        if: env.SIGN_IDENT != ''
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements .github/macos/producer.entitlements \
            --sign "$SIGN_IDENT" "$APP"

      - name: Gates — dependency closure + no-Qt + deep-strict verify
        run: |
          # engine-closure.sh enforces that every @rpath dep EXISTS in the
          # assembled bundle — the gate that turns v0.2.0's launch crash red.
          ./scripts/engine-closure.sh "$APP/Contents"
          ./scripts/check-no-qt.sh "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 scripts/check-camera-bundle.py "$APP"

      - name: Notarize + staple app
        if: env.SIGN_IDENT != ''
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP" /tmp/Producer.zip
          xcrun notarytool submit /tmp/Producer.zip \
            --apple-id "$NOTARY_ID" --password "$NOTARY_PW" --team-id "$NOTARY_TEAM" \
            --wait --output-format json | tee /tmp/notary.json
          SUB_ID="$(python3 -c "import json;print(json.load(open('/tmp/notary.json'))['id'])")"
          STATUS="$(python3 -c "import json;print(json.load(open('/tmp/notary.json'))['status'])")"
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization $STATUS — per-file issues:" >&2
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$NOTARY_ID" --password "$NOTARY_PW" --team-id "$NOTARY_TEAM" || true
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl -a -t exec -vv "$APP"

      - name: Package DMG (+ sign, notarize, staple)
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          DMG="Producer_${VERSION}_aarch64.dmg"
          ROOT=/tmp/dmgroot
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          cp -R "$APP" "$ROOT/"
          ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname "Producer" -srcfolder "$ROOT" -ov -format UDZO "$DMG"
          if [ -n "${SIGN_IDENT:-}" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENT" "$DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$NOTARY_ID" --password "$NOTARY_PW" --team-id "$NOTARY_TEAM" \
              --wait
            xcrun stapler staple "$DMG"
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload DMG as Actions artifact (dry-run proof)
        uses: actions/upload-artifact@v4
        with:
          name: Producer-macos-arm64-live
          path: ${{ env.DMG }}

      - name: Stage Apple Silicon installer in the release draft
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" "$DMG" --clobber

      # Auto-update leg: the updater archive must contain the ASSEMBLED,
      # notarized app (tauri's auto-generated one is the engine-less
      # intermediate — never ship that).
      - name: Stage notarized Apple Silicon updater archive
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          UPD="Producer_${VERSION}_aarch64.app.tar.gz"
          tar -czf "$UPD" -C "$(dirname "$APP")" "$(basename "$APP")"
          bun run tauri signer sign "$UPD" --password "" >/dev/null
          test -f "$UPD.sig" || { echo "FATAL: updater signature not produced" >&2; exit 1; }
          gh release upload "v$VERSION" "$UPD" "$UPD.sig" --clobber

  # ── Windows x64 + Live engine (Producer Live) ──────────────────────────────
  # Mirror of build-macos-arm64-live for the Windows engine. Same rule set:
  #   engine artifact on disk BEFORE tauri build   (build.rs::link_live_engine_windows
  #     sets cfg(have_engine) only when PRODUCER_ENGINE_DIR/bin/obs.dll exists;
  #     absent artifact = silent stub build — build-windows.ps1 refuses an exe
  #     that does not import obs.dll)
  #   engine staged FLAT beside producer.exe       (src-tauri/windows-bundle/ →
  #     install root; the loader only searches the exe's own directory, and
  #     obs-*-test.exe encoder probes run relative to it)
  # The whole body is the Windows session's local path (scripts/windows-engine.ps1
  # + scripts/build-windows.ps1) so CI ships exactly what that box verified.
  # There is no Windows code-signing certificate wired; the installer is unsigned.
  build-windows-live:
    if: ${{ !cancelled() && inputs.promote_run == '' && (needs.validate-public-source.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
    needs: [validate-public-source]
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        # Windows PowerShell 5.1 - what the scripts were written and verified
        # against (build-windows.ps1 works around a 5.1 quoting quirk).
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Parse Windows qualification scripts before building
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          foreach ($script in @('scripts/build-windows.ps1','scripts/test-windows-installed.ps1','scripts/test-windows-engine.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $script), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # v0.2.0 postmortem applies here too: NO fallbacks, NO stale artifacts.
      # Get-EngineDir resolves producer-libobs-windows-x64-<sha256(obs.lock)[0:12]>
      # from the last 10 green engine.yml runs, checks the sha256 sidecar, and
      # throws "no engine artifact matches the current obs.lock (...)" on a
      # miss - run engine.yml for this lock first, then re-run the release.
      - name: Fetch engine artifact (current obs.lock hash - fail hard on miss)
        run: |
          # The script probes `python -c "import zstandard"`; under
          # $ErrorActionPreference=Stop a missing module's traceback on stderr
          # is a terminating NativeCommandError. Satisfy the probe up front.
          python -m pip install --quiet zstandard
          . .\scripts\windows-engine.ps1
          $name = Get-EngineName
          Write-Host "want: $name"
          # Last pipeline element: pip/extract output from inside the function
          # must not turn the path into an array.
          $dir = @(Get-EngineDir)[-1]
          if (-not (Test-Path (Join-Path $dir "bin\obs.dll"))) {
            throw "FATAL: engine artifact missing after fetch - refusing to ship a stub build"
          }
          Write-Host "engine: CI source-build artifact at $dir"
          "ENGINE_NAME=$name" >> $env:GITHUB_ENV
          # Pin the artifact for every later cargo invocation in this job so
          # build.rs never falls back to mtime resolution.
          "PRODUCER_ENGINE_DIR=$dir" >> $env:GITHUB_ENV

      # engine-closure-windows.sh: zero-Qt + full PE import closure + every
      # allowlisted plugin, obs-browser and its CEF payload present.
      - name: Gate - engine closure
        run: |
          . .\scripts\windows-engine.ps1
          Test-EngineGate $env:PRODUCER_ENGINE_DIR

      # Stages windows-bundle/, builds producer.exe against the engine, bundles
      # the NSIS installer with the engine flattened into the install root, and
      # refuses to continue if the exe does not import obs.dll. Updater .sig is
      # emitted because TAURI_SIGNING_PRIVATE_KEY is set.
      - name: Build NSIS installer (engine linked + staged beside producer.exe)
        run: .\scripts\build-windows.ps1

      # Preserve the exact installer for diagnosis if the hosted qualification
      # environment fails. It is not staged on the public release draft here.
      - name: Preserve Windows installer before runtime checks
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: Producer-windows-x64-unqualified-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7

      - name: Qualify installed Windows engine
        if: ${{ github.event_name == 'push' || inputs.publish }}
        timeout-minutes: 6
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri\target\release\bundle\nsis\Producer_${version}_x64-setup.exe"
          .\scripts\test-windows-installed.ps1 -Installer $installer -ExpectedExecutable src-tauri\target\release\producer.exe -OutputDir "$env:RUNNER_TEMP\producer-windows-installed-proof"

      # Hosted Windows runners do not guarantee a D3D11 adapter. Still compile
      # and link the same native pixel probe used on a Windows GPU workstation.
      - name: Check Windows native compositor linkage
        run: .\scripts\test-windows-native.ps1 -EngineDir .\src-tauri\windows-bundle -CompileOnly

      # Compile once before the bounded runtime window. Each exact native
      # test then owns its own libobs/CEF process; an absent/zero-test match
      # or unavailable D3D11 adapter cannot be reported as a runtime pass.
      - name: Ensure recording inspection prerequisite
        if: ${{ github.event_name == 'push' || inputs.publish }}
        timeout-minutes: 6
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output --execution-timeout=300
            if ($LASTEXITCODE -ne 0) { throw 'ffmpeg prerequisite failed' }
          }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw 'ffprobe unavailable' }
          ffprobe -version | Select-Object -First 1

      - name: Prepare Windows native runtime qualification
        if: ${{ github.event_name == 'push' || inputs.publish }}
        timeout-minutes: 30
        run: .\scripts\test-windows-engine.ps1 -EngineDir $env:PRODUCER_ENGINE_DIR -OutputDir "$env:RUNNER_TEMP\producer-windows-runtime-proof" -PrepareOnly

      - name: Qualify Windows native runtime
        if: ${{ github.event_name == 'push' || inputs.publish }}
        timeout-minutes: 25
        run: .\scripts\test-windows-engine.ps1 -EngineDir $env:PRODUCER_ENGINE_DIR -OutputDir "$env:RUNNER_TEMP\producer-windows-runtime-proof" -RunOnly -MaxRuntimeSeconds 1200

      - name: Preserve Windows installed and runtime evidence
        if: ${{ always() && (github.event_name == 'push' || inputs.publish) }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-windows-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/producer-windows-installed-proof/*.json
            ${{ runner.temp }}/producer-windows-installed-proof/*.log
            ${{ runner.temp }}/producer-windows-runtime-proof/**
          if-no-files-found: warn
          retention-days: 90

      # The MSI is a courtesy asset (the updater leg is the NSIS exe); the
      # Windows session has only ever verified the NSIS path, so a WiX failure
      # must not sink the release. Same build-only config the script wrote, so
      # the resources map identically; cargo sees no change and just re-bundles.
      - name: Build MSI installer (best-effort)
        id: msi
        continue-on-error: true
        run: |
          $cfg = Join-Path $env:TEMP "producer-local-build.json"
          if (-not (Test-Path $cfg)) { throw "build-only config from build-windows.ps1 not found at $cfg" }
          bun run tauri build --features guest-rtc-production --bundles msi --config $cfg
          if ($LASTEXITCODE -ne 0) { throw "msi bundle failed" }

      - name: Collect release assets
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri\target\release\bundle\nsis\Producer_${version}_x64-setup.exe"
          foreach ($f in $exe, "$exe.sig") {
            if (-not (Test-Path $f)) { throw "FATAL: $f not produced" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe, "$exe.sig" dist\
          $msi = "src-tauri\target\release\bundle\msi\Producer_${version}_x64_en-US.msi"
          if ((Test-Path $msi) -and (Test-Path "$msi.sig")) {
            Copy-Item $msi, "$msi.sig" dist\
          } else {
            Write-Host "::warning::MSI not produced (msi step outcome: ${{ steps.msi.outcome }}) - shipping the NSIS installer only"
          }
          Get-ChildItem dist | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload installers as Actions artifact (dry-run proof)
        uses: actions/upload-artifact@v4
        with:
          name: Producer-windows-x64-live
          path: dist/*
          if-no-files-found: error

      - name: Stage Windows installers in the release draft
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          # Only the installers and their updater signatures. `dist/` is the
          # web bundle's own output dir too (index.html, assets/), and a
          # directory in the upload list fails the whole step.
          for f in dist/Producer_*_x64-setup.exe dist/Producer_*_x64-setup.exe.sig dist/Producer_*_x64_en-US.msi dist/Producer_*_x64_en-US.msi.sig; do
            [ -f "$f" ] || continue
            gh release upload "v$VERSION" "$f" --clobber
          done


  # Keep the previous public release current until every new platform passes.
  publish-verified-release:
    if: ${{ inputs.promote_run == '' && (github.event_name == 'push' || inputs.publish) }}
    needs: [validate-public-source, build, build-macos-arm64-live, build-windows-live]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RELEASE_ID: ${{ needs.validate-public-source.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact release commit
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          runs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/workflows/ci.yml/runs?head_sha={sha}&per_page=100']))['workflow_runs']
          green = [r for r in runs if r['name'] == 'CI' and r['head_sha'] == sha and r['status'] == 'completed' and r['conclusion'] == 'success']
          assert green, 'No successful CI workflow exists for the exact release commit; finish CI before publishing'
          print(f'Validated release source {sha} against CI run {green[0]["id"]}')
          PY
      - name: Verify all updater payload signatures before public promotion
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 scripts/verify-release-payloads.py
      - name: Publish the verified release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path('/tmp/producer-release-verification')
          receipt = json.loads((out / 'verification.json').read_text())
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          release_id = os.environ['PRODUCER_RELEASE_ID']
          assert receipt['releaseId'] == int(release_id) and receipt['sha'] == sha
          endpoint = f'repos/{repo}/releases/{release_id}'
          draft = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert draft['draft'] and not draft['prerelease'] and draft['target_commitish'] == sha
          assert draft['tag_name'] == 'v' + receipt['version']
          assets = {a['name']: a for a in draft['assets'] if a['state'] == 'uploaded'}
          for name in ('latest.json', 'verification.json'):
              data = (out / name).read_bytes()
              assert assets[name]['size'] == len(data)
              assert assets[name]['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest(), f'{name} was not staged on the reserved draft'
          body = dict(draft=False, make_latest='true', body=(out / 'release-notes.md').read_text())
          release = json.loads(subprocess.check_output(['gh', 'api', '--method', 'PATCH', endpoint, '--input', '-'], input=json.dumps(body), text=True))
          assert not release['draft'] and not release['prerelease']
          print(release['html_url'])
          PY
