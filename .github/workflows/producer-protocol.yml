name: Producer protocol conformance
on:
  push:
    paths: ['protocol/**', 'crates/production-runtime/**', '.github/workflows/producer-protocol.yml']
  pull_request:
    paths: ['protocol/**', 'crates/production-runtime/**', '.github/workflows/producer-protocol.yml']
permissions:
  contents: read
jobs:
  round-trip:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo build --locked --manifest-path crates/production-runtime/Cargo.toml -p producer-production-cli
      - run: npm install --prefix "$RUNNER_TEMP/producer-peer" --no-save playwright-core@1.65.1
      - name: Verify signed native and browser round trip
        run: |
          export NODE_PATH="$RUNNER_TEMP/producer-peer/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          export PRODUCER_CORE="$PWD/crates/production-runtime/target/debug/producer-core"
          python3 protocol/v1/conformance/check.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify show, participant readiness and editable DAW return
        run: |
          python -m pip install numpy==2.2.6 dawdreamer==0.9.0
          python protocol/v1/conformance/mfm_check.py --core crates/production-runtime/target/debug/producer-core
          python protocol/v1/conformance/session_check.py --core crates/production-runtime/target/debug/producer-core
