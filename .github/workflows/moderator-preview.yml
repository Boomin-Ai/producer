name: Moderator preview
on:
  push:
    branches: [fix/moderator-sources-preview]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Fetch matching live engine
        run: |
          python -m pip install --quiet zstandard
          . .\scripts\windows-engine.ps1
          $dir = @(Get-EngineDir)[-1]
          if (-not (Test-Path (Join-Path $dir "bin\obs.dll"))) { throw "Matching live engine is missing" }
          "PRODUCER_ENGINE_DIR=$dir" >> $env:GITHUB_ENV
          Test-EngineGate $dir
      - name: Build native moderator preview
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Producer-moderator-preview-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
