name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      network_mac_source_sha:
        description: "Unreleased Mac dev candidate only (integration branch); full source SHA, blank runs normal CI"
        required: false
        type: string
        default: ""
      network_mac_notarize:
        description: "Notarize/staple the unreleased Mac dev candidate"
        required: false
        type: boolean
        default: true

jobs:
  network-mac-dev:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/producer-network-links' && inputs.network_mac_source_sha != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/network-mac-dev.yml
    with:
      source_sha: ${{ inputs.network_mac_source_sha }}
      notarize: ${{ inputs.network_mac_notarize }}
    secrets: inherit

  frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/producer-network-links' && inputs.network_mac_source_sha != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:performance-trace
      - run: python3 scripts/profile-production.py --self-test
      - run: bun run test:presentation
      - run: node scripts/test-dj-set-feed.mjs
      - run: bun run test:module-push
      - run: bun run test:set-control
      - run: bun run test:room-set-control
      - run: bun run test:control-arrangements
      - run: bun run test:module-arrangements
      - run: bun run test:package-validation
      - run: bun run test:set-publication
      - run: bun run test:set-authoring
      - run: bun run test:voice-bars
      - run: bun run test:threads-social
      - run: bun run test:module-runtime
      - run: node scripts/test-just-facts-show.mjs
      - run: node scripts/test-atmosphere.mjs
      - run: node scripts/scene3d/test.mjs
      - run: node scripts/test-windows-native-imports.mjs
      - run: python3 scripts/test-release-windows.py
      - run: node scripts/validate-set.mjs assets/creator-library/sets/*.set.json
      - run: npm ci --prefix tools/producer-streamdeck/ai.boomin.producer.sounds.sdPlugin
      - run: node tools/producer-streamdeck/test.mjs
      - run: cc -std=c11 -Wall -Wextra -fsanitize=address,undefined scripts/test-soundboard-native.c -o /tmp/soundboard-test -lpthread -lm && /tmp/soundboard-test
      - run: node scripts/test-sets-v2-readiness-progress.mjs
      - run: bun run test:scene-restoration
      - run: bun run test:manager-cache
      - run: bun run test:prepared-scenes
      - run: bun run test:roster-poll
      - run: node scripts/test-preview-session.mjs
      - run: node scripts/test-room-session.mjs
      - run: node scripts/test-room-control.mjs
      - run: node scripts/test-room-votes.mjs
      - run: node scripts/test-program-readiness.mjs
      - run: node scripts/test-guest-return.mjs
      - run: node scripts/test-guest-reconnect.mjs
      - run: bun run test:producer-network
      - run: node scripts/test-native-appearance.mjs
      - run: bun run --cwd server/guest typecheck
      - run: node --experimental-strip-types --test tests/slotMath.test.ts
      - run: node --experimental-strip-types --test tests/stageTruth.test.ts
      - run: node --experimental-strip-types --test tests/featureFlags.test.ts
      - run: node --experimental-strip-types --test tests/shareDomain.test.ts
      - run: node --test tests/siteRoomRoutes.test.mjs
      - run: node scripts/test-site-public-routes.mjs
      - run: python3 scripts/ci-network-mac-dev.py self-test
      - run: node scripts/ci-network-mac-dev-origin-smoke.mjs --self-test
      - run: bash scripts/test-notary-staple-retry.sh
      - run: bash scripts/test-codesign-retry.sh

  server:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/producer-network-links' && inputs.network_mac_source_sha != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Server tests import shared app document types; resolve their dependencies too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  sound-library-preview:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/producer-network-links' && inputs.network_mac_source_sha != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix tools/producer-mcp
      - run: node tools/producer-mcp/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify guest playback feedback and stable expanded program video
        env:
          PRODUCER_BROWSER_CHANNEL: chromium
        run: |
          node scripts/test-return-audio-browser.mjs
          node scripts/test-program-expansion-browser.mjs
          node scripts/test-appearance-room-lifecycle.mjs
      - name: Verify beta setup, consent and responsive entry screens
        env:
          PRODUCER_BROWSER_CHANNEL: chromium
        run: |
          node scripts/test-beta-onboarding-browser.mjs
          node scripts/test-entry-presentation-browser.mjs
      - name: Verify public profile pages and explicit Set publication UI
        env:
          PRODUCER_BROWSER_CHANNEL: chromium
        run: |
          node scripts/test-publication-browser.mjs
          node scripts/test-site-public-browser.mjs
      - name: Verify library previews without changing room assignments or live playback
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 --port 1436 --strictPort > /tmp/producer-preview-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1436/scripts/soundboard-browser.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-sound-library-preview.mjs

  rust:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/producer-network-links' && inputs.network_mac_source_sha != '') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows dev runtime helper staging
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-dev-helpers.ps1
      # ffi.rs <-> shim parity. The Windows leg is an engine-less `cargo check`
      # that never compiles shim_win.c, so a producer_* extern missing from it
      # only fails at the real release link (#27). This needs no engine and
      # no compiler, so it runs first and fails fast.
      - name: Check ffi.rs extern parity with shim.m / shim_win.c
        if: runner.os == 'Linux'
        run: bash scripts/check-extern-parity.sh
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          # Avoid the Azure mirror stalling large WebKit downloads on hosted runners.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native appearance ownership, routing and quality policies
        if: runner.os == 'Linux'
        run: bash scripts/test-native-appearance-policy.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path scripts/sets-v2/rust-probe/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-fPIC' || '' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Check Windows native guest runtime and static CRT linkage
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features guest-rtc-production --lib
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
