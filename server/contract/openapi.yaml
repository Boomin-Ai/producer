openapi: 3.1.0
info:
  title: Producer API Contract
  version: 0.1.0
  description: |
    The contract every Producer backend implements and every Producer
    client consumes. Two known backends: Boomin hosted (`api.boomin.ai`,
    lean `/v1/app/producer/*` mount) and self-hosted `producer-server`.
    The desktop app, the CLI, `producer-mcp`, and any user agent or
    script are all equal clients of this spec.

    Governed by docs/PHASE1.md (v4.1.1, FROZEN). Load-bearing rules:

    **Token classes.** Two bearer token classes, not RBAC:
    `primary` (everything) and `automation` (publish, read, media
    upload only). Routes marked `x-token-class: primary` reject
    automation tokens with 403 `token_class_insufficient`. Humans
    establish channel authority; agents exercise granted authority.

    **Idempotency.** Transport is at-least-once; acceptance is
    effectively-once. Every mutating submission route requires an
    `Idempotency-Key` header. Server contract:
    UNIQUE(actor, operation, idempotency_key); new key -> create,
    persist key + payload hash + canonical result; same key + same
    payload -> return the original result (200, `replayed: true`);
    same key + different payload -> 409 `idempotency_conflict`.
    Keys are durable, never TTL'd; `client_request_id` is retained
    permanently on the job record.

    **Publish-now is a job.** Omitting `schedule_at` creates a job due
    now. Post Now and Schedule differ only in due time - same queue,
    same state machine, same idempotency.

    **Media.** A post references media by durable `upload_id` (obtained
    via an upload slot; client PUTs to a short-lived presigned URL and
    never touches storage credentials) or by stable public `url`.
    Uploads never attached to a post are garbage-collected after an
    orphan TTL. Backends expose fetchable media to platforms only
    through opaque bearer-capability URLs (>=128-bit CSPRNG, never
    logged), never a public bucket.

    **Capabilities, not doctrine.** Clients render limits (rate limits,
    media constraints, text lengths) from each channel's `capabilities`
    object - never from constants baked into a client.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt

security:
  - bearer: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and implementation identity (no auth)
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /v1/session:
    get:
      operationId: getSession
      summary: Validate the presented token and describe its authority
      responses:
        "200":
          description: Token is valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/channels:
    get:
      operationId: listChannels
      summary: List connected channels with their capabilities
      responses:
        "200":
          description: Channels available to this account.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/channels/{platform}/connect-session:
    post:
      operationId: createConnectSession
      summary: Begin channel authorization (human completes in browser)
      description: |
        Returns a one-time browser URL containing an ephemeral,
        single-use nonce. The bearer token never appears in the URL;
        the OAuth callback is authenticated by validated single-use
        `state`, not bearer auth. Channel authorization is always an
        explicit human OAuth action.
      x-token-class: primary
      parameters:
        - name: platform
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Platform" }
      responses:
        "201":
          description: Connect session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TokenClassInsufficient" }

  /v1/channels/{channelId}:
    delete:
      operationId: disconnectChannel
      summary: Disconnect a channel and revoke its stored credentials
      x-token-class: primary
      parameters:
        - $ref: "#/components/parameters/channelId"
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TokenClassInsufficient" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/media/uploads:
    post:
      operationId: createUploadSlot
      summary: Request an upload slot (presigned PUT; no credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201":
          description: Slot created; PUT the raw bytes to `put_url`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSlot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Declared size exceeds the backend's limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/media/{uploadId}:
    get:
      operationId: getUpload
      summary: Inspect an upload's status
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Upload state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/posts:
    post:
      operationId: createPost
      summary: Submit one publishing job for one channel
      description: |
        One call targets exactly one channel and creates at most one
        job (the idempotency unit matches the client outbox's
        submission_targets row). Multi-channel fan-out is a client
        concern: the client submits one request per target, all
        sharing an `intent_id` for grouping in history. Omitting
        `schedule_at` means due now.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePostRequest" }
      responses:
        "201":
          description: Job created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResult" }
        "200":
          description: >
            Replay: this idempotency key with an identical payload was
            already accepted; the original result is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Same idempotency key, different payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Preflight failed (see capability constraints).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightFailure" }

  /v1/jobs:
    get:
      operationId: listJobs
      summary: List jobs (queue and history are one listing)
      parameters:
        - name: state
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/JobState" }
          style: form
          explode: false
        - name: channel_id
          in: query
          schema: { type: string }
        - name: intent_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Jobs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Inspect one job
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: rescheduleJob
      summary: Reschedule a not-yet-published job
      parameters:
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule_at]
              properties:
                schedule_at: { type: string, format: date-time }
      responses:
        "200":
          description: Rescheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Job is already publishing or terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a not-yet-published job
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Canceled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          description: Job is already publishing or terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/jobs/{jobId}/retry:
    post:
      operationId: retryJob
      summary: Re-queue a failed job (retries only this job)
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Re-queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          description: Job is not in a retryable state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Live guests (host ↔ guest over WebRTC; the server only introduces) ──────
  # Same paths on both backends. Host family: x-token-class primary. Guest
  # family (/v1/connect/guest…): NO bearer — the invite code, room code,
  # render key or 120 s signaling ticket in the request is the credential.
  # Full DTOs: see server/src/guests.ts (publicRoom, publicGuest, roomRoster).

  /v1/app/live/rooms:
    get:
      operationId: listLiveRooms
      x-token-class: primary
      summary: Every room on this server
      responses:
        "200":
          description: Rooms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms: { type: array, items: { $ref: "#/components/schemas/LiveRoom" } }
    post:
      operationId: createLiveRoom
      x-token-class: primary
      summary: Register a room (idempotent by external_ref)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 80 }
                external_ref: { type: string, maxLength: 200, description: The client's own room id. Same ref → same room. }
      responses:
        "200":
          description: The room, and whether this call created it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: { $ref: "#/components/schemas/LiveRoom" }
                  created: { type: boolean }
  /v1/app/live/rooms/{roomId}:
    patch:
      operationId: updateLiveRoom
      x-token-class: primary
      summary: Rename / set config
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "200": { description: Updated room (`{ room }`). }
    delete:
      operationId: deleteLiveRoom
      x-token-class: primary
      summary: Delete a room (refused while anyone is in it)
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "200": { description: "`{ ok: true }`" }
        "409":
          description: "`room_occupied` — a guest is waiting or admitted; remove them first (`details.present` = how many)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/app/live/rooms/{roomId}/guests:
    get:
      operationId: liveRoomRoster
      x-token-class: primary
      summary: The roster Producer polls (~3 s); stamps host presence
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "200":
          description: "`{ guests: RosterGuest[] }` — render_url only for admitted guests."
          content:
            application/json:
              schema:
                type: object
                properties:
                  guests: { type: array, items: { $ref: "#/components/schemas/RosterGuest" } }
    post:
      operationId: inviteLiveGuest
      x-token-class: primary
      summary: Invite a named guest by link (invite_url returned once)
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "201": { description: "`{ guest, invite_url, render_url }`" }
        "422": { description: "`network_unavailable` if guest_brand_id is sent — brand guests need Boomin." }
  /v1/app/live/rooms/{roomId}/stage:
    post:
      operationId: setLiveStage
      x-token-class: primary
      summary: Publish the FULL on-stage list (filtered to admitted guests; versioned; pushed to the room channel)
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "200": { description: "`{ on_stage: string[], version: number }`" }
        "409": { description: "`stage_full`" }
  /v1/app/live/rooms/{roomId}/guest-order:
    post:
      operationId: setLiveGuestOrder
      x-token-class: primary
      summary: Host-controlled slot order (`{ order: string[] }`)
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "200": { description: "`{ ok: true }`" }
  /v1/app/live/rooms/{roomId}/guest-link:
    post:
      operationId: setLiveGuestLink
      x-token-class: primary
      summary: Enable / rotate / disable the room's public join link
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                rotate: { type: boolean, description: New code; revokes WAITING link guests. }
                auto_admit: { type: boolean }
                remove_admitted: { type: boolean, description: With rotate — also eject admitted link guests. }
      responses:
        "200": { description: "`{ join_url: string|null (only at rotation), enabled, auto_admit }`" }
  /v1/app/live/guests/{guestId}/admit:
    post:
      operationId: admitLiveGuest
      x-token-class: primary
      parameters: [{ $ref: "#/components/parameters/guestId" }]
      responses:
        "200": { description: "`{ guest }`" }
  /v1/app/live/guests/{guestId}/revoke:
    post:
      operationId: revokeLiveGuest
      x-token-class: primary
      summary: Kick (server-side flip; the render source keeps its framing)
      parameters: [{ $ref: "#/components/parameters/guestId" }]
      responses:
        "200": { description: "`{ guest }`" }

  /v1/connect/guest/room/{code}/join:
    post:
      operationId: joinLiveRoomByLink
      security: []
      summary: A stranger joins by room link → `waiting` (or `accepted` with auto_admit)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 80 }
                resume_code: { type: string, description: Previous invite_code — resumes the SAME slot on reload. }
                producer_ref: { type: string, maxLength: 200, description: "DOCUMENTED, NOT IMPLEMENTED (issue 46): another Producer instance entering as a guest presents its origin (self-host) or workspace id; sets `kind: producer`. Display metadata, never a credential." }
      responses:
        "201": { description: "`{ guest, invite_code, resumed: false }`" }
        "200": { description: "`{ guest, invite_code, resumed: true }`" }
        "409": { description: "`guest_room_full`" }
        "410": { description: "`guest_link_disabled`" }
  /v1/connect/guest/{code}:
    get:
      operationId: getLiveGuest
      security: []
      responses:
        "200": { description: "`{ guest }`" }
        "410": { description: "`guest_revoked` | `guest_declined` | `guest_ended`" }
  /v1/connect/guest/{code}/accept:
    post: { operationId: acceptLiveGuest, security: [], responses: { "200": { description: "`{ guest }` (idempotent)" } } }
  /v1/connect/guest/{code}/decline:
    post: { operationId: declineLiveGuest, security: [], responses: { "200": { description: "`{ ok: true }`" } } }
  /v1/connect/guest/{code}/session:
    post:
      operationId: liveGuestSession
      security: []
      summary: Guest-side signaling ticket (accepted guests only)
      responses:
        "200": { description: "`{ signaling_ticket, signaling_url, channel, peer_id, role, ice_servers, expires_in }`" }
        "409": { description: "`guest_not_accepted`" }
  /v1/connect/guest/{code}/room-session:
    post:
      operationId: liveGuestRoomSession
      security: []
      summary: Ticket to the ROOM channel + the current stage list
      responses:
        "200": { description: "`{ signaling_ticket, signaling_url, peer_id, stage: { on_stage, version } }`" }
  /v1/connect/guest/render/{guestId}/session:
    post:
      operationId: liveRenderSession
      security: []
      summary: Render-side ticket (Producer's browser source; `?k=` render key)
      responses:
        "200": { description: "Signaling fields + `display_name`, `guest_status`." }
  /v1/connect/guest/render/{guestId}/quality:
    post:
      operationId: liveRenderQuality
      security: []
      summary: Render page reports inbound quality (`good|degraded|failing`)
      responses:
        "200": { description: "`{ ok: true }`" }
  /v1/connect/guest-signal:
    get:
      operationId: liveGuestSignal
      security: []
      summary: WebSocket upgrade (`?ticket=`) → the per-guest signaling Durable Object. Status re-checked at CONNECT.
      responses:
        "101": { description: Switching protocols. }
        "401": { description: "`invalid_ticket`" }
        "410": { description: "`guest_unavailable`" }
  /v1/connect/guest-room-signal:
    get:
      operationId: liveRoomSignal
      security: []
      summary: WebSocket upgrade (`?ticket=`) → the room's signaling Durable Object (stage pushes, guest↔guest).
      responses:
        "101": { description: Switching protocols. }

  # ── Contribution model (docs/CONTRIBUTIONS.md) — DOCUMENTED, NOT IMPLEMENTED ──
  # Every operation below carries `x-status: documented-unimplemented` and an
  # `x-issue`. The server mounts each one behind the same gate as its family and
  # answers 501 NotImplemented (`code: not_implemented`, `issue`) until the
  # issue lands. Nouns: participant, grant, contribution, interaction. Never
  # brand, deal, wallet. No money routes, ever.

  /v1/app/live/guests/{guestId}/grants:
    post:
      operationId: setParticipantGrant
      x-token-class: primary
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/46
      summary: Grant or revoke ONE participant grant (e.g. media.screen, the higher grant a guest does not hold by default)
      parameters: [{ $ref: "#/components/parameters/guestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, enabled]
              properties:
                grant: { $ref: "#/components/schemas/Grant" }
                enabled: { type: boolean }
      responses:
        "200": { description: "`{ guest: RosterGuest }` with the updated `grants`. The bundle is sealed into the guest's ticket at its next exchange; revoking kills the track at that exchange." }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /v1/app/live/rooms/{roomId}/contributions:
    get:
      operationId: liveRoomContributions
      x-token-class: primary
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/50
      summary: The run's interval ledger — who supplied what, from when to when, where on the set
      parameters:
        - { $ref: "#/components/parameters/roomId" }
        - { name: run_id, in: query, required: false, schema: { type: string }, description: Limit to one run; default = the open run, else the latest. }
      responses:
        "200":
          description: "`{ contributions: Contribution[] }` newest first. Intervals are append-only; an open one has `ended_at: null`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  contributions: { type: array, items: { $ref: "#/components/schemas/Contribution" } }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /v1/app/live/rooms/{roomId}/interactions:
    get:
      operationId: listInteractions
      x-token-class: primary
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/51
      summary: Interactions of the open run, projected for the host (raw inputs included)
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      responses:
        "200": { description: "`{ interactions: Interaction[] }`" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createInteraction
      x-token-class: primary
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/51
      summary: Open an interaction (v1 = a two-choice `vote`); the RoomState Durable Object is authoritative, outcomes persist
      parameters: [{ $ref: "#/components/parameters/roomId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionCreate" }
      responses:
        "201": { description: "`{ interaction: Interaction }` in state `open` with server-stamped `timing`." }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /v1/app/live/rooms/{roomId}/interactions/{interactionId}:
    patch:
      operationId: transitionInteraction
      x-token-class: primary
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/51
      summary: "Host/mod transition: `open` (start collecting) · `reveal` (arm the reveal — the SERVER fires it on an alarm at `reveal_at`; a client never sets `revealed` directly) · `close`"
      parameters:
        - { $ref: "#/components/parameters/roomId" }
        - { $ref: "#/components/parameters/interactionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transition]
              properties:
                transition: { type: string, enum: [open, reveal, close, cancel] }
                reveal_hold_ms: { type: integer, minimum: 0, description: Dramatic pause before pixels (reveal only). }
      responses:
        "200": { description: "`{ interaction: Interaction }` — `version` incremented; clients ignore stale." }
        "409": { description: "`interaction_state` — the transition is not legal from the current state (e.g. a client asking for `revealed` before `reveal_at`)." }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/connect/audience/{code}/token:
    post:
      operationId: mintAudienceToken
      security: []
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/51
      summary: The room-code door — mint a per-DEVICE audience capability token. No account, no email, no cookie.
      parameters: [{ name: code, in: path, required: true, schema: { type: string }, description: The room's short audience code (resolvable only while the room is open). }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { type: string, maxLength: 64, description: Client-generated, replayed on reconnect so the same device keeps its identity hash. }
                display_name: { type: string, maxLength: 24, description: Optional pseudonym, filtered at the door, room-scoped. }
      responses:
        "201":
          description: "`AudienceToken` — `aud: audience`, `sub: aud_<random>`, expires with the show (max 12 h)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudienceToken" }
        "404": { description: "`room_not_open` — the code resolves only while the room is open." }
        "409": { description: "`audience_full` | `audience_locked`" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /v1/connect/audience/interactions/{interactionId}/inputs:
    post:
      operationId: submitAudienceInput
      security: [{ audience: [] }]
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/51
      summary: "An input from an audience device (`Authorization: Bearer <AudienceToken>`). Counted once per identity hash; the tally never stores the sub."
      parameters: [{ $ref: "#/components/parameters/interactionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionInput" }
      responses:
        "202": { description: "`{ accepted: true, cooldown_until? }` — server clock; a control is disabled until a server timestamp, never a client countdown." }
        "409": { description: "`interaction_not_collecting` | `input_already_counted`" }
        "429": { description: "`rate_limited` — per-identity token bucket from `input.rate`." }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /v1/connect/guest/{code}/interactions/{interactionId}/inputs:
    post:
      operationId: submitGuestInput
      security: []
      x-status: documented-unimplemented
      x-issue: https://github.com/Boomin-Ai/producer/issues/51
      summary: An input from a guest — the invite code is the credential. Writes one `input` contribution bound to the interaction.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/interactionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionInput" }
      responses:
        "202": { description: "`{ accepted: true }`" }
        "409": { description: "`interaction_not_collecting` | `input_already_counted` | `guest_not_accepted`" }
        "501": { $ref: "#/components/responses/NotImplemented" }


components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        Endpoint access token. Class `primary` or `automation`; see
        info.description for the class rules.
    audience:
      type: http
      scheme: bearer
      description: >
        DOCUMENTED, NOT IMPLEMENTED (issue 51). A per-device audience
        capability token minted at the room-code door (`AudienceToken`):
        HS256 like the signaling tickets, `aud: audience`, `sub: aud_<random>`,
        no identity in the payload. Authorizes inputs to interactions in ONE
        room for the life of the show. Never an endpoint token class.

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated, unique per submission target. Durable
        server-side forever; replays return the original result.
      schema: { type: string, minLength: 16, maxLength: 128 }
    channelId:
      name: channelId
      in: path
      required: true
      schema: { type: string }
    roomId:
      name: roomId
      in: path
      required: true
      schema: { type: string }
    guestId:
      name: guestId
      in: path
      required: true
      schema: { type: string }
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    interactionId:
      name: interactionId
      in: path
      required: true
      schema: { type: string, pattern: "^ix_[A-Za-z0-9]{12,}$" }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TokenClassInsufficient:
      description: >
        Route requires the primary endpoint token
        (code `token_class_insufficient`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotImplemented:
      description: >
        The operation is in the contract but this server has not built it yet
        (`x-status: documented-unimplemented`). Body carries the contract
        error envelope AND the flat form: `code: not_implemented`, `issue`
        = the tracking issue. The route IS mounted and gated — a 401/403 here
        is the real access answer; only the 501 is temporary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NotImplementedResponse" }

  schemas:
    LiveRoom:
      type: object
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        kind: { type: string, enum: [camera] }
        config: { type: object }
        external_ref: { type: string, nullable: true }
        visibility: { type: string, enum: [private] }
        is_default: { type: boolean }
        session: { nullable: true }
        created_at: { type: string, format: date-time }
    RosterGuest:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        state: { type: string, enum: [waiting, invited, connected, admitted, left] }
        joined_via: { type: string, enum: [invite, room_link] }
        kind:
          allOf: [{ $ref: "#/components/schemas/ParticipantKind" }]
          description: "DOCUMENTED, NOT IMPLEMENTED (issue 46). What credential stands behind the row. A self-hosted server emits `visitor` | `producer` only."
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
          description: "DOCUMENTED, NOT IMPLEMENTED (issue 46). The capabilities this participant holds in this room; sealed into its ticket at mint, re-read at every exchange. Default = the guest bundle (camera, mic, return_feed, vote, text, hand — never screen)."
        render_url: { type: string, nullable: true, description: Only for admitted guests. Stable for the guest's life. }
        guest_brand: { nullable: true, description: Always null on a self-hosted server. }
        avatar_url: { type: string, nullable: true }
        position: { type: integer, nullable: true }
        snapshot: { type: string, nullable: true }
        quality: { type: string, enum: [good, degraded, failing, unknown] }
        joined_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
    ServerInfo:
      type: object
      required: [ok, implementation, contract_version]
      properties:
        ok: { type: boolean }
        implementation:
          type: string
          description: e.g. "boomin-hosted" or "producer-server".
        version: { type: string }
        contract_version: { type: string }

    Session:
      type: object
      required: [token_class, server]
      properties:
        token_class: { $ref: "#/components/schemas/TokenClass" }
        account:
          type: object
          properties:
            display_name: { type: string }
        server: { $ref: "#/components/schemas/ServerInfo" }

    TokenClass:
      type: string
      enum: [primary, automation]

    Platform:
      type: string
      enum: [instagram, facebook, threads]
      description: v0.1 platforms. New senders extend this enum.

    Channel:
      type: object
      required: [id, platform, display_name, status, capabilities]
      properties:
        id: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        display_name: { type: string }
        external_handle: { type: string }
        status:
          type: string
          enum: [active, needs_reconnect, disabled]
        capabilities: { $ref: "#/components/schemas/ChannelCapabilities" }

    ChannelCapabilities:
      type: object
      description: >
        Rendered by clients as the source of truth for constraints.
        Senders emit these; clients never hardcode platform numbers.
      properties:
        rateLimit:
          type: object
          required: [type, max, windowSeconds]
          properties:
            type: { type: string, enum: [rolling_window] }
            max: { type: integer }
            windowSeconds: { type: integer }
        media:
          type: object
          properties:
            kinds:
              type: array
              items: { type: string, enum: [image, video, reel] }
            maxBytes: { type: integer }
            aspect:
              type: object
              properties:
                min: { type: number }
                max: { type: number }
        text:
          type: object
          properties:
            maxChars: { type: integer }
        features:
          type: object
          properties:
            native_scheduling:
              type: boolean
              description: >
                Platform executes the schedule itself (e.g. Facebook
                scheduled_publish_time).

    ConnectSession:
      type: object
      required: [browser_url, expires_at]
      properties:
        browser_url:
          type: string
          format: uri
          description: One-time URL with an ephemeral single-use nonce.
        expires_at: { type: string, format: date-time }

    CreateUploadRequest:
      type: object
      required: [filename, content_type, size_bytes]
      properties:
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }

    UploadSlot:
      type: object
      required: [upload_id, put_url, expires_at]
      properties:
        upload_id: { type: string }
        put_url:
          type: string
          format: uri
          description: Short-lived presigned PUT target for raw bytes.
        expires_at: { type: string, format: date-time }

    Upload:
      type: object
      required: [upload_id, status]
      properties:
        upload_id: { type: string }
        status:
          type: string
          enum: [pending, stored, attached, orphan_expired]
        content_type: { type: string }
        size_bytes: { type: integer }

    MediaRef:
      description: Durable media reference. Exactly one of the two.
      oneOf:
        - type: object
          required: [upload_id]
          properties:
            upload_id: { type: string }
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: >
                Stable public URL; must stay reachable until the job
                fires. Early deletion produces a retryable error.

    CreatePostRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id: { type: string }
        text: { type: string }
        media:
          type: array
          maxItems: 1
          items: { $ref: "#/components/schemas/MediaRef" }
        overrides:
          type: object
          description: >
            Per-platform options (e.g. IG reel share_to_feed, Threads
            reply_control, FB page targeting). Validated against the
            channel's sender.
        schedule_at:
          type: string
          format: date-time
          description: Omit for due-now. Same queue either way.
        intent_id:
          type: string
          description: >
            Client-generated grouping id shared by all targets of one
            logical draft; echoed on jobs for history grouping.

    SubmitResult:
      type: object
      required: [job, replayed]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        replayed:
          type: boolean
          description: True when returned from an idempotent replay.

    JobState:
      type: string
      enum: [scheduled, queued, publishing, published, failed, canceled]

    ErrorClass:
      type: string
      enum: [retryable, token_expired, rate_limited, permanent]

    Job:
      type: object
      required: [id, channel_id, state, due_at, created_at]
      properties:
        id: { type: string }
        channel_id: { type: string }
        intent_id: { type: string }
        client_request_id:
          type: string
          description: The Idempotency-Key that created this job. Permanent.
        state: { $ref: "#/components/schemas/JobState" }
        attempt: { type: integer }
        due_at: { type: string, format: date-time }
        next_attempt_at: { type: string, format: date-time }
        error_class: { $ref: "#/components/schemas/ErrorClass" }
        error_message:
          type: string
          description: Plain-language, user-renderable.
        published_external_id: { type: string }
        published_external_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }

    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor: { type: string }

    PreflightFailure:
      type: object
      required: [error, issues]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable code, e.g. unauthorized,
            token_class_insufficient, idempotency_conflict, not_found,
            invalid_request, preflight_failed, rate_limited.
        message: { type: string }
        details: { type: object }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    # ── Contribution model (docs/CONTRIBUTIONS.md) — DOCUMENTED, NOT IMPLEMENTED ──

    ParticipantKind:
      type: string
      enum: [visitor, producer, audience, member, connection]
      description: >
        How strong the identity behind a participant row is — never what it
        can do (that is `grants`). `visitor`: the invite/room code is the whole
        credential. `producer`: another Producer instance entering (display
        metadata `producer_ref`, never a third trust level). `audience`: a
        per-device capability token, never media, never a roster row per phone.
        `member` and `connection` require Boomin identities and are refused by
        a self-hosted server (`422 network_unavailable`).

    Grant:
      type: string
      enum:
        - media.camera
        - media.mic
        - media.screen
        - media.return_feed
        - input.vote
        - input.text
        - input.hand
        - room.admit
        - room.stage
        - room.mute
        - room.remove
        - room.interactions
      description: >
        A capability a participant holds in a room. Three families — media,
        input, control. A role (guest, contestant, audience, mod) is a named
        bundle the host picks. `media.screen` is the higher grant a guest does
        not hold by default. `room.end` / `room.settings` are never grants:
        host only. Nothing here is ever about money.

    ContributionKind:
      type: string
      enum: [presence, media.screen, overlay, input, credit]

    Contribution:
      type: object
      required: [id, room_id, kind, binding, started_at, source]
      description: >
        WHO supplied WHAT to the program, FROM WHEN TO WHEN, WHERE on the set.
        One shape for presence on stage, a screen, a logo, a vote, a typed
        line. Intervals are append-only: close by writing `ended_at` once,
        never edit. The server stamps time; a client never asserts a duration.
        `UNIQUE (participant_id, kind, started_at)` — retries never fork an
        interval. Same shape on Boomin; this server never prices one.
      properties:
        id: { type: string }
        room_id: { type: string }
        run_id: { type: string, nullable: true }
        participant_id: { type: string, nullable: true, description: A roster guest id; null for host-supplied contributions (an overlay the host shows). }
        kind: { $ref: "#/components/schemas/ContributionKind" }
        binding:
          type: object
          description: "Where on the set — a STABLE stage id: `{ slot }`, `{ lane }`, `{ corner }`, `{ interaction_id }`."
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, description: null while open; an open interval self-expires against the host heartbeat. }
        source: { type: string, enum: [host_stage, participant, interaction, host_credit] }
        metadata: { type: object }

    InteractionType:
      type: string
      enum: [vote, choice, text, reaction, hand, cue, share_request, rating, wordcloud]
      description: v1 opens with `vote`; the rest are payloads on the same object (docs/INTERACTIVE.md §2.2). New game, no migration.

    InteractionState:
      type: string
      enum: [draft, open, collecting, revealed, closed, cancelled]
      description: "`open` = visible, inputs not yet accepted · `collecting` = accepting · `revealed` = results shown per visibility · `closed` = archived, immutable. `revealed` is set by a SERVER alarm, never by a client."

    InteractionCreate:
      type: object
      required: [type, spec]
      description: The envelope from `producer.interaction/v1` (docs/INTERACTIVE.md §2.4), minus server-owned fields.
      properties:
        type: { $ref: "#/components/schemas/InteractionType" }
        spec: { type: object, description: "Per-type body, e.g. `{ prompt, options: [{id,label}] }` for a vote." }
        input: { type: object, description: "Who may input, how often, as whom: `{ roles, identity, per_identity, rate, moderation, filter }`." }
        visibility: { type: object, description: "Who sees what, when: `{ running_tally, reveal, reveal_to, inputs }`. The set is a visibility target." }
        timing: { type: object, description: "`{ collect_ms, reveal_hold_ms, close_after_ms, stream_delay_ms }` — the server stamps `opened_at` / `reveal_at`." }
        render:
          type: array
          items: { type: object, description: "`{ surface: set|host|guest|audience, kind, style?, anchor?, z?, occlude? }`" }

    Interaction:
      allOf:
        - { $ref: "#/components/schemas/InteractionCreate" }
        - type: object
          required: [id, room_id, state, version]
          properties:
            id: { type: string, pattern: "^ix_[A-Za-z0-9]{12,}$" }
            room_id: { type: string }
            state: { $ref: "#/components/schemas/InteractionState" }
            version: { type: integer, minimum: 0, description: Increments on every transition; clients ignore stale. }
            tally: { type: object, description: Server-computed results — the only thing an audience ever reads back. Projected per role before sending. }
            server_now: { type: string, format: date-time, description: Every frame carries the server clock; countdowns are `reveal_at - server_now + local_offset`. }

    InteractionInput:
      type: object
      required: [value]
      description: One input. `value` is per type — an option id for vote/choice, text for text/wordcloud, an emoji for reaction, `true`/`false` for hand.
      properties:
        value: {}
        client_input_id: { type: string, maxLength: 64, description: Client-generated; a retry with the same id is counted once. }

    AudienceToken:
      type: object
      required: [token, expires_at, room]
      properties:
        token: { type: string, description: Bearer for the `audience` security scheme. Stored on the device, replayed on reconnect. }
        expires_at: { type: string, format: date-time }
        room: { type: object, properties: { id: { type: string }, title: { type: string, nullable: true } } }
        display_name: { type: string, nullable: true }

    NotImplementedResponse:
      type: object
      required: [error, code, issue]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        code: { type: string, enum: [not_implemented] }
        issue: { type: string, format: uri, description: The issue that builds this operation. }
