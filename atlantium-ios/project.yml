name: Atlantium
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 9936A69867
    MARKETING_VERSION: '2.0.1'
    CURRENT_PROJECT_VERSION: 5
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.9.0
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    exactVersion: 5.5.1
targets:
  Atlantium:
    type: application
    platform: iOS
    sources: [Sources, Core, Assets.xcassets]
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: OneSignal
        product: OneSignalFramework
      - package: OneSignal
        product: OneSignalInAppMessages
      - package: OneSignal
        product: OneSignalLocation
      - target: AtlantiumNotificationService
        embed: true
    entitlements:
      path: Config/Atlantium.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.security.application-groups: [group.com.atlantium.app.onesignal]
    info:
      path: Config/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.atlantium.app.auth
            CFBundleURLSchemes: [atlantium-auth]
        CFBundleDisplayName: Atlantium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Share your camera when you join an Atlantium live room.
        NSMicrophoneUsageDescription: Speak with the Atlantium community in live rooms.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        OneSignalAppID: c083d166-0d67-4754-9bb5-2e0adc4e6f92
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlantium.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  AtlantiumNotificationService:
    type: app-extension
    platform: iOS
    sources: [Extension]
    dependencies:
      - package: OneSignal
        product: OneSignalExtension
    entitlements:
      path: Config/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.atlantium.app.onesignal]
    info:
      path: Config/Extension.plist
      properties:
        CFBundleDisplayName: Atlantium Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlantium.app.OneSignalNotificationServiceExtension
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1'
  AtlantiumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Atlantium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlantium.app.UITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Atlantium
schemes:
  Atlantium:
    build:
      targets:
        Atlantium: all
    test:
      targets: [AtlantiumUITests]
